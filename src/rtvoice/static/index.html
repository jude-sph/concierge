<title>rtvoice — live demo panel</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #08090b;
    --panel: #131519;
    --panel-soft: #1a1d22;
    --hairline: #2a2e35;
    --fg: #f2f4f7;
    --fg-dim: #8b93a1;
    --fg-faint: #565d69;
    --accent: #4fd1c5;
    --user: #7ab8ff;
    --assistant: #4fd1c5;
    --warn: #ffb02e;
    --warn-bg: rgba(255, 176, 46, 0.14);
    --bad: #ff5c5c;
    --good: #52d17a;
    --highlight: #52ffcf;
    --highlight-bg: rgba(82, 255, 207, 0.16);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
  }
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  /* ---------- top bar: mic control only, no product banner ---------- */

  header {
    display: flex; align-items: center; gap: 18px;
    padding: 14px 20px; flex: 0 0 auto;
  }

  #btn-start-stop {
    font-family: inherit; font-size: 18px; font-weight: 700; letter-spacing: 0.02em;
    padding: 14px 32px; border-radius: 999px;
    border: 2px solid var(--accent); background: transparent; color: var(--accent);
    cursor: pointer; min-width: 210px;
  }
  #btn-start-stop.running {
    background: var(--bad); border-color: var(--bad); color: #1a0000;
    animation: mic-pulse 1.6s ease-in-out infinite;
  }
  @keyframes mic-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 92, 92, 0.55); }
    50%      { box-shadow: 0 0 0 12px rgba(255, 92, 92, 0); }
  }

  .conn-status { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--fg-faint); }
  .conn-status span.bad { color: var(--bad); }

  #mic-error { color: var(--bad); font-size: 14px; font-weight: 600; }

  /* ---------- main layout ---------- */

  main {
    flex: 1 1 auto; display: grid; min-height: 0;
    grid-template-columns: 1.5fr 1fr;
    gap: 18px; padding: 0 20px 16px;
  }

  .panel { background: var(--panel); border-radius: 14px; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .panel h2 {
    margin: 0; padding: 14px 20px 10px; font-size: 13px; text-transform: uppercase;
    letter-spacing: 0.09em; color: var(--fg-dim); font-weight: 700;
    flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
  }

  /* CSS Grid, not flex: this column previously used a flex column with
     flex-basis:auto on both children. That algorithm computes each child's
     "hypothetical size" from its own content, then -- when the total
     exceeds the available height -- shrinks BOTH children by the same
     *relative* fraction (flex-shrink is proportional to flex-basis, so with
     equal shrink factors every item loses the same percentage of its own
     basis). The phone-data table's content-based height is enormous
     compared to the task list's, so both panels got shrunk by the same
     large percentage -- and applied to the small task panel's modest
     basis, that percentage crushed it down to a ~40px sliver (just the
     header). A max-height ceiling on the task panel (the previous attempt)
     does nothing for this: the problem was never that it grew too tall,
     it was that the shrink math crushed it regardless of any cap.
     Grid tracks don't have that failure mode: each row is sized from its
     own content independently, then the 1fr row absorbs whatever is left
     (floored at 0, so it scrolls internally instead of stealing space from
     the other row). fit-content(60%) lets the task row size to its actual
     content (no void when empty/small) while still capping it so a long
     task list can't push the phone-data panel away. */
  .sidebar {
    display: grid;
    grid-template-rows: fit-content(60%) minmax(120px, 1fr);
    gap: 18px; min-height: 0;
  }

  /* ---------- conversation: the spine ---------- */

  .conversation-panel { flex: 1 1 auto; }
  #waiting-banner {
    display: none; margin: 0 20px 10px; padding: 12px 16px; border-radius: 10px;
    background: var(--warn-bg); color: var(--warn); font-size: 16px; font-weight: 600;
  }
  #waiting-banner.show { display: block; }

  .conversation-body { flex: 1 1 auto; overflow-y: auto; padding: 4px 20px 20px; min-height: 0; }
  .turn { margin-bottom: 20px; line-height: 1.5; font-size: 19px; max-width: 92%; }
  .turn .who { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 4px; }
  .turn.user { margin-right: auto; }
  .turn.assistant { margin-left: auto; text-align: right; }
  .turn.user .who { color: var(--user); }
  .turn.assistant .who { color: var(--assistant); }
  .turn.user .bubble { background: rgba(122, 184, 255, 0.10); border-radius: 14px 14px 14px 4px; padding: 10px 16px; display: inline-block; text-align: left; }
  .turn.assistant .bubble { background: rgba(79, 209, 197, 0.10); border-radius: 14px 14px 4px 14px; padding: 10px 16px; display: inline-block; text-align: left; }
  .silent-tag { display: block; color: var(--warn); font-size: 12px; font-weight: 600; margin-top: 4px; }
  .empty { color: var(--fg-faint); font-style: italic; padding: 6px 20px 20px; }

  /* ---------- tasks: what it's doing ----------
     .tasks-panel is a grid row (see .sidebar above), sized to its own
     content up to fit-content(60%). min-height is an explicit floor --
     belt-and-braces against the row track shrinking away -- so the card
     with the confirmation prompt can never be reduced to a sliver. */

  .tasks-panel { min-height: 140px; }
  .tasks-body { flex: 1 1 auto; overflow-y: auto; padding: 4px 16px 16px; min-height: 0; }

  .task-card {
    border-radius: 10px; padding: 14px 18px; margin-bottom: 12px;
    background: var(--panel-soft); border-left: 4px solid var(--fg-faint);
  }
  .task-card .task-what { font-size: 19px; font-weight: 600; }
  .task-card .task-status { display: inline-block; margin-top: 8px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-dim); }
  .task-card .task-detail { margin-top: 8px; font-size: 16px; color: var(--fg-dim); }

  .task-card.status-done { border-left-color: var(--good); }
  .task-card.status-done .task-status { color: var(--good); }
  .task-card.status-running { border-left-color: var(--accent); }
  .task-card.status-running .task-status { color: var(--accent); }
  .task-card.status-pending .task-status { color: var(--fg-dim); }
  .task-card.status-failed, .task-card.status-cancelled { border-left-color: var(--bad); opacity: 0.85; }
  .task-card.status-failed .task-status, .task-card.status-cancelled .task-status { color: var(--bad); }

  /* The awaiting_confirm card is the one thing on screen that blocks on the
     user, so it gets outsized type -- readable at a glance from across a
     room -- rather than sharing the modest sizing of ordinary task cards. */
  .task-card.needs-confirm {
    border-left: none; background: var(--warn-bg); padding: 26px 28px;
    animation: confirm-pulse 1.8s ease-in-out infinite;
  }
  .task-card.needs-confirm .task-what { font-size: 22px; }
  .task-card.needs-confirm .task-status { color: var(--warn); font-size: 15px; }
  .task-card.needs-confirm .task-detail { color: var(--fg); font-size: 30px; font-weight: 700; line-height: 1.3; margin-top: 12px; }
  @keyframes confirm-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 176, 46, 0.45); }
    50%      { box-shadow: 0 0 0 10px rgba(255, 176, 46, 0); }
  }

  .task-card.flash { animation: card-flash 2.2s ease-out; }
  @keyframes card-flash {
    0%   { background: var(--highlight-bg); }
    100% { background: var(--panel-soft); }
  }

  /* ---------- device data: the payoff ---------- */

  /* .device-panel is the sidebar's second grid row (minmax(120px, 1fr)):
     it takes whatever height the task panel didn't use and scrolls
     internally (.device-body) if its own content is taller than that. */
  .device-panel { min-height: 0; }
  .device-body { flex: 1 1 auto; overflow-y: auto; padding: 4px 20px 20px; min-height: 0; }

  .device-table { margin-bottom: 20px; }
  .device-table h4 { margin: 0 0 6px; font-size: 12px; color: var(--fg-dim); text-transform: uppercase; letter-spacing: 0.07em; font-weight: 700; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--hairline); vertical-align: top; }
  th { color: var(--fg-dim); font-weight: 600; font-size: 12px; }

  tr.row-changed td { background: var(--highlight-bg); }
  tr.row-changed { animation: row-flash 2.2s ease-out; }
  @keyframes row-flash {
    0%   { background: rgba(82, 255, 207, 0.45); }
    100% { background: transparent; }
  }

  /* ---------- footer: text fallback + collapsed raw log ---------- */

  footer {
    flex: 0 0 auto; padding: 12px 20px 16px;
  }
  #inject-form { display: flex; gap: 8px; opacity: 0.85; }
  #inject-text {
    flex: 1; font-family: inherit; font-size: 14px; padding: 9px 12px;
    background: var(--panel); border: 1px solid var(--hairline); border-radius: 8px; color: var(--fg);
  }
  #inject-form button {
    font-family: inherit; font-size: 13px; padding: 9px 18px; border-radius: 8px;
    border: 1px solid var(--hairline); background: transparent; color: var(--fg-dim); cursor: pointer;
  }

  details#raw-log { margin-top: 8px; }
  details#raw-log summary {
    cursor: pointer; font-size: 12px; color: var(--fg-faint); text-transform: uppercase;
    letter-spacing: 0.06em; user-select: none;
  }
  #event-log-body {
    margin-top: 8px; max-height: 180px; overflow-y: auto;
    font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; line-height: 1.5;
    color: var(--fg-faint); white-space: pre-wrap; word-break: break-word;
    background: var(--panel); border-radius: 8px; padding: 8px 10px;
  }

  /* ---------- reset: deliberately far from the mic button in the header,
     small and muted so it can't be hit by accident mid-demo, with its own
     confirm dialog as a second guard against a stray click. ---------- */
  .footer-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-top: 8px; }
  .footer-row details#raw-log { margin-top: 0; flex: 1 1 auto; min-width: 0; }
  #btn-reset {
    font-family: inherit; font-size: 11px; font-weight: 600; padding: 7px 14px;
    border-radius: 7px; border: 1px solid var(--hairline); background: transparent;
    color: var(--fg-faint); cursor: pointer; letter-spacing: 0.05em;
    text-transform: uppercase; opacity: 0.6; flex: 0 0 auto;
  }
  #btn-reset:hover:not(:disabled) { color: var(--bad); border-color: var(--bad); opacity: 1; }
  #btn-reset:disabled { opacity: 0.35; cursor: default; }
</style>

<header>
  <button id="btn-start-stop">Start listening</button>
  <div class="conn-status">
    <span id="chip-mic">mic off</span>
    <span id="chip-audio">audio off</span>
    <span id="chip-events">events connecting…</span>
  </div>
  <span id="mic-error"></span>
</header>

<main>
  <section class="panel conversation-panel">
    <h2>Conversation</h2>
    <div id="waiting-banner"></div>
    <div id="transcript-body" class="conversation-body"><div class="empty">Say something to get started.</div></div>
  </section>

  <div class="sidebar">
    <section class="panel tasks-panel">
      <h2>What it's doing</h2>
      <div id="tasks-body" class="tasks-body"><div class="empty">Nothing going on right now.</div></div>
    </section>

    <section class="panel device-panel">
      <h2>Phone data</h2>
      <div id="device-body" class="device-body"></div>
    </section>
  </div>
</main>

<footer>
  <form id="inject-form">
    <input id="inject-text" type="text" autocomplete="off"
           placeholder="Type instead of speaking (works even if mic/TTS is unavailable)" />
    <button type="submit">Send</button>
  </form>
  <div class="footer-row">
    <details id="raw-log">
      <summary>Raw events</summary>
      <div id="event-log-body"></div>
    </details>
    <button id="btn-reset" type="button"
            title="Clear tasks and conversation, and restore the phone data to its starting state">
      Reset demo
    </button>
  </div>
</footer>

<script>
"use strict";

// --- small helpers -----------------------------------------------------------

function escapeHtml(s) {
  return String(s === undefined || s === null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function wsUrl(path) {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  return `${proto}://${location.host}${path}`;
}

function setChip(id, text, cls) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = cls ? cls : "";
}

// --- raw event log: collapsed developer detail, off by default -----------------

const eventLines = [];

function appendEventLog(msg) {
  const line = `[${msg.t_ms}ms] ${msg.kind} ${JSON.stringify(msg.data)}`;
  eventLines.push(line);
  if (eventLines.length > 400) eventLines.shift();
  const el = document.getElementById("event-log-body");
  el.textContent = eventLines.join("\n");
  if (document.getElementById("raw-log").open) el.scrollTop = el.scrollHeight;
}

// --- transcript ---------------------------------------------------------------
//
// Built from the SAME event stream the raw log shows, not re-derived audio:
//   user_utterance      -> what the user said, logged the instant it's
//                          recorded (see orchestrator.py's on_turn_event) --
//                          NOT "to_reasoner", which only fires once the
//                          reasoner is actually invoked. An ordinary
//                          utterance can sit in the fragment-merge window for
//                          up to merge_window_ms before that happens, while
//                          the concierge answers immediately; a transcript
//                          keyed on "to_reasoner" showed the assistant's
//                          reply BEFORE the user's own words for exactly that
//                          reason. user_utterance fires in the same order
//                          orch.history is built in, so this can't happen.
//   concierge_act       -> the conversational reply, when the concierge is on
//   spoken_fact         -> the reasoner's own answer, spoken verbatim by
//                          Orchestrator._speak_facts.
//   tts_failed          -> TTS raised (e.g. kokoro not installed); the text
//                          above is still correct, just mark it silent.
//
// Both assistant sources are rendered, unconditionally, because both are
// really spoken and they say different things: the concierge acknowledges,
// the reasoner answers. This used to key off `from_reasoner` and show it only
// while a concierge_act had never been seen -- a rule from v1, when the
// concierge RELAYED the reasoner's words and showing both would have
// duplicated one line. Facts stopped going through the concierge when
// _speak_facts was introduced, so that rule quietly meant the reasoner's
// answers were never written down at all once the concierge was switched on:
// the system read out the contact list and the conversation showed nothing
// between the question and whatever was said next.

const transcript = [];

function pushTranscript(role, text) {
  transcript.push({ role, text, silent: false });
  if (transcript.length > 200) transcript.shift();
}

function markLastAssistantSilent(text) {
  for (let i = transcript.length - 1; i >= 0; i--) {
    if (transcript[i].role === "assistant" && transcript[i].text === text) {
      transcript[i].silent = true;
      return;
    }
  }
}

function handleTranscriptEvent(msg) {
  const data = msg.data || {};
  if (msg.kind === "user_utterance" && data.text) {
    pushTranscript("user", data.text);
  } else if (msg.kind === "concierge_act") {
    if (data.text) pushTranscript("assistant", data.text);
  } else if (msg.kind === "spoken_fact") {
    if (data.text) pushTranscript("assistant", data.text);
  } else if (msg.kind === "tts_failed" && data.text) {
    markLastAssistantSilent(data.text);
  } else {
    return; // nothing to re-render
  }
  renderTranscript();
}

function clearTranscript() {
  transcript.length = 0;
  renderTranscript();
}

function renderTranscript() {
  const el = document.getElementById("transcript-body");
  if (!transcript.length) {
    el.innerHTML = '<div class="empty">Say something to get started.</div>';
    return;
  }
  el.innerHTML = transcript.map((t) => {
    const label = t.role === "user" ? "You" : "Assistant";
    const suffix = t.silent ? '<span class="silent-tag">(no audio — TTS unavailable)</span>' : "";
    return `<div class="turn ${t.role}"><span class="who">${label}</span>` +
      `<span class="bubble">${escapeHtml(t.text)}</span>${suffix}</div>`;
  }).join("");
  el.scrollTop = el.scrollHeight;
}

// --- events websocket ----------------------------------------------------------

function connectEvents() {
  setChip("chip-events", "events connecting…", "");
  const ws = new WebSocket(wsUrl("/events"));
  ws.onopen = () => setChip("chip-events", "events live", "");
  ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    appendEventLog(msg);
    handleTranscriptEvent(msg);
  };
  ws.onclose = () => {
    setChip("chip-events", "events reconnecting…", "bad");
    setTimeout(connectEvents, 1000);
  };
  ws.onerror = () => ws.close();
}

// --- tasks + device state, via polling /state -----------------------------------
//
// Simplification made under time pressure: tasks are rendered from GET /state
// (the same endpoint the device panel already needs to poll) rather than
// re-derived independently from the event stream. It is still "live" -- just
// on a ~500ms poll instead of push -- and is far less code to get right before
// tonight than reconstructing task rows from from_reasoner events by hand.
//
// A task/row's "just changed" highlight is tracked by wall-clock timestamp
// rather than "did it change on THIS poll", so it stays visible for a fixed
// window regardless of poll timing -- otherwise a change could get replaced
// by an un-flashed re-render within a single 500ms tick.

const HIGHLIGHT_MS = 4000;

// Only pending/awaiting_confirm/running are "live". Terminal tasks (done,
// failed, cancelled) still get shown for a short payoff window after they
// land -- so the user sees the moment something finishes -- then drop out
// so completed work doesn't crowd out what's actually happening. The window
// is tracked by wall-clock time of first observing the terminal state, the
// same approach the device-table row highlight already uses below, rather
// than "changed on THIS poll" so it survives independent of poll timing.
const TASK_TERMINAL = new Set(["done", "failed", "cancelled"]);
const TASK_LINGER_MS = 7000;

const PLAIN_STATUS = {
  pending: "Queued",
  running: "Working on it…",
  awaiting_confirm: "Needs your OK",
  done: "Done",
  failed: "Didn't work",
  cancelled: "Cancelled",
};

const TASK_RANK = { awaiting_confirm: 0, running: 1, pending: 2, done: 3, failed: 3, cancelled: 3 };

const lastTaskStatus = {};
const taskChangedAt = {};
const taskTerminalSince = {};
let firstStatePoll = true;

function plainStatus(status) {
  return PLAIN_STATUS[status] || (status ? status[0].toUpperCase() + status.slice(1) : "");
}

function trackTask(t, now) {
  if (!firstStatePoll && lastTaskStatus[t.task_id] !== undefined && lastTaskStatus[t.task_id] !== t.status) {
    taskChangedAt[t.task_id] = now;
  }
  lastTaskStatus[t.task_id] = t.status;

  if (TASK_TERMINAL.has(t.status)) {
    if (taskTerminalSince[t.task_id] === undefined) {
      // A task that's already terminal the very first time we ever see it
      // (e.g. the page just loaded) had its payoff moment happen off
      // screen -- backdate it so it reads as expired instead of lingering.
      taskTerminalSince[t.task_id] = firstStatePoll ? 0 : now;
    }
  } else {
    delete taskTerminalSince[t.task_id];
  }
}

function isTaskVisible(t, now) {
  if (!TASK_TERMINAL.has(t.status)) return true;
  const since = taskTerminalSince[t.task_id];
  return since !== undefined && (now - since) < TASK_LINGER_MS;
}

function renderTasks(tasks) {
  const el = document.getElementById("tasks-body");
  const now = Date.now();
  tasks.forEach((t) => trackTask(t, now));
  const visible = tasks.filter((t) => isTaskVisible(t, now));
  if (!visible.length) {
    el.innerHTML = '<div class="empty">Nothing going on right now.</div>';
    return;
  }
  const ordered = visible.map((t, i) => ({ t, i })).sort((a, b) => {
    const ra = TASK_RANK[a.t.status] ?? 2, rb = TASK_RANK[b.t.status] ?? 2;
    return ra !== rb ? ra - rb : a.i - b.i;
  });
  const cards = ordered.map(({ t }) => {
    const recentlyChanged = (now - (taskChangedAt[t.task_id] || 0)) < HIGHLIGHT_MS;
    const needsConfirm = t.status === "awaiting_confirm";
    const cls = ["task-card", "status-" + String(t.status || "").toLowerCase()];
    if (needsConfirm) cls.push("needs-confirm");
    else if (recentlyChanged) cls.push("flash");
    return `<div class="${cls.join(" ")}">` +
      `<div class="task-what">${escapeHtml(t.understood_as)}</div>` +
      `<div class="task-status">${escapeHtml(plainStatus(t.status))}</div>` +
      (t.detail ? `<div class="task-detail">${escapeHtml(t.detail)}</div>` : "") +
      `</div>`;
  }).join("");
  el.innerHTML = cards;
}

let lastDeviceRows = {};
const deviceChangedAt = {};

function capitalize(s) {
  return s ? s[0].toUpperCase() + s.slice(1) : s;
}

function renderDevice(device) {
  const el = document.getElementById("device-body");
  const nextRows = {};
  const now = Date.now();
  let html = "";
  for (const [table, rows] of Object.entries(device)) {
    nextRows[table] = {};
    deviceChangedAt[table] = deviceChangedAt[table] || {};
    html += `<div class="device-table"><h4>${escapeHtml(capitalize(table))}</h4>`;
    if (!Array.isArray(rows) || rows.length === 0) {
      html += `<div class="empty">(empty)</div></div>`;
      continue;
    }
    const cols = [...new Set(rows.flatMap((r) => Object.keys(r)))];
    const prevTable = lastDeviceRows[table] || {};
    const bodyRows = rows.map((row) => {
      const key = row.id !== undefined ? String(row.id) : JSON.stringify(row);
      const json = JSON.stringify(row);
      nextRows[table][key] = json;
      if (!firstStatePoll && prevTable[key] !== undefined && prevTable[key] !== json) {
        deviceChangedAt[table][key] = now;
      }
      const recentlyChanged = (now - (deviceChangedAt[table][key] || 0)) < HIGHLIGHT_MS;
      const cls = recentlyChanged ? "row-changed" : "";
      const tds = cols.map((c) => `<td>${escapeHtml(row[c])}</td>`).join("");
      return `<tr class="${cls}">${tds}</tr>`;
    }).join("");
    html += `<table><thead><tr>${cols.map((c) => `<th>${escapeHtml(c)}</th>`).join("")}</tr></thead>` +
      `<tbody>${bodyRows}</tbody></table></div>`;
  }
  el.innerHTML = html;
  lastDeviceRows = nextRows;
}

function renderWaitingBanner(data) {
  const el = document.getElementById("waiting-banner");
  if (data.pending_question) {
    el.textContent = "Waiting for your answer: " + data.pending_question;
    el.classList.add("show");
  } else {
    el.classList.remove("show");
  }
}

async function pollState() {
  try {
    const res = await fetch("/state");
    if (!res.ok) return;
    const data = await res.json();
    renderTasks(data.tasks || []);
    renderDevice(data.device || {});
    renderWaitingBanner(data);
    firstStatePoll = false;
    // Keep highlight windows re-rendering even without underlying data
    // changes, so the flash actually fades out on screen instead of
    // sticking until the next real change.
  } catch (e) {
    // server not reachable yet; try again on the next tick
  }
}

// --- reset: POST /reset ---------------------------------------------------------
//
// Restores a clean slate server-side (device data, tasks, history, any
// pending confirmation -- see orchestrator.py's Orchestrator.reset) and then
// clears the client-side mirrors of that same state, so the UI doesn't sit
// there showing a stale transcript and task list against a server that has
// already forgotten them. Deliberately guarded by a confirm() dialog on top
// of the button's own small, muted, out-of-the-way styling -- this is meant
// to be reachable between demo runs, not a single miss-click away mid-demo.

function clearObjInPlace(obj) {
  for (const k of Object.keys(obj)) delete obj[k];
}

async function resetDemo() {
  if (!confirm("Reset the demo?\n\nThis clears tasks and conversation history, "
    + "and restores the phone data to its starting state. This cannot be undone.")) {
    return;
  }
  const btn = document.getElementById("btn-reset");
  btn.disabled = true;
  try {
    const res = await fetch("/reset", { method: "POST" });
    if (!res.ok) throw new Error("server returned " + res.status);

    clearTranscript();
    clearObjInPlace(lastTaskStatus);
    clearObjInPlace(taskChangedAt);
    clearObjInPlace(taskTerminalSince);
    lastDeviceRows = {};
    clearObjInPlace(deviceChangedAt);
    firstStatePoll = true;
    await pollState();
  } catch (err) {
    document.getElementById("mic-error").textContent = "reset failed: " + err.message;
  } finally {
    btn.disabled = false;
  }
}

// --- text fallback: POST /inject -----------------------------------------------

async function onInjectSubmit(e) {
  e.preventDefault();
  const input = document.getElementById("inject-text");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  try {
    await fetch("/inject", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
  } catch (err) {
    console.error("inject failed", err);
  }
}

// --- mic capture + playback, over /audio ----------------------------------------
//
// AudioContext is created with {sampleRate: 16000} so modern browsers run the
// whole capture graph at 16 kHz already (getUserMedia's sampleRate constraint
// alone is not reliable across browsers, but MediaStreamSourceNode always
// resamples the track to the context's rate). The worklet just chunks
// whatever it receives into fixed 2560-sample (160ms) frames.
//
// Playback is a different rate: synthesized speech now arrives over the wire
// at Kokoro's native PLAYBACK_SAMPLE_RATE (see rtvoice/tts.py's
// OUTPUT_SAMPLE_RATE, which this must match), not the 16 kHz the mic path
// uses. That is fine even though the context itself runs at 16 kHz --
// AudioBuffer's sample rate is independent of the context's, and
// AudioBufferSourceNode resamples to the context's rate on playback. What
// matters is constructing the buffer at the rate the bytes actually are, or
// every reply plays back pitch-shifted and at the wrong speed.
const PLAYBACK_SAMPLE_RATE = 24000;

const WORKLET_SOURCE = `
class PCMChunker extends AudioWorkletProcessor {
  constructor() {
    super();
    this._buf = new Float32Array(0);
    this._chunkSize = 2560;
  }
  process(inputs) {
    const input = inputs[0];
    if (input && input.length > 0) {
      const channel = input[0];
      if (channel && channel.length) {
        const merged = new Float32Array(this._buf.length + channel.length);
        merged.set(this._buf, 0);
        merged.set(channel, this._buf.length);
        this._buf = merged;
        while (this._buf.length >= this._chunkSize) {
          const chunk = this._buf.slice(0, this._chunkSize);
          this._buf = this._buf.slice(this._chunkSize);
          this.port.postMessage(chunk, [chunk.buffer]);
        }
      }
    }
    return true;
  }
}
registerProcessor("pcm-chunker", PCMChunker);
`;

let running = false;
let micStream = null;
let audioCtx = null;
let sourceNode = null;
let captureNode = null;
let silentGain = null;
let audioWs = null;
let nextPlaybackTime = 0;

// Every AudioBufferSourceNode currently scheduled or playing, so a barge-in
// can actually stop them -- with no reference kept, there would be no way to
// reach back into WebAudio's internal scheduling queue and silence audio
// that was already handed to it.
let activeSources = [];

function playback(arrayBuffer) {
  if (!audioCtx) return;
  const floatData = new Float32Array(arrayBuffer);
  if (!floatData.length) return;
  const buf = audioCtx.createBuffer(1, floatData.length, PLAYBACK_SAMPLE_RATE);
  buf.copyToChannel(floatData, 0);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  if (nextPlaybackTime < now + 0.02) nextPlaybackTime = now + 0.02;
  src.start(nextPlaybackTime);
  nextPlaybackTime += buf.duration;
  activeSources.push(src);
  src.onended = () => {
    const i = activeSources.indexOf(src);
    if (i !== -1) activeSources.splice(i, 1);
  };
}

// --- barge-in: stop audio the instant the user starts talking -----------------
//
// The server already halts TTS generation on barge-in (Stop(), guarded by
// _speech_gen/_speak_lock -- see orchestrator.py), but that only stops
// chunks not yet produced. Anything already sent is already sitting in
// activeSources, scheduled on the WebAudio clock, and would otherwise keep
// playing to completion regardless of what the server does next. The server
// signals a cancellation over the SAME /audio socket as a small text/JSON
// control frame -- unambiguous from the binary PCM frames by WebSocket frame
// TYPE (not by sniffing content), since binaryType is fixed to "arraybuffer"
// for the audio frames but a text frame still arrives as a plain string
// regardless of that setting. See audio_ws.py's on_playback_cancel.
function cancelPlayback() {
  for (const src of activeSources) {
    src.onended = null; // already stopping it deliberately; not a barge-in loop
    try { src.stop(0); } catch (e) {}
    try { src.disconnect(); } catch (e) {}
  }
  activeSources = [];
  // Reset the scheduling clock so the NEXT reply starts fresh relative to
  // "now" instead of picking up wherever the cancelled one left off (which
  // would otherwise front-load a long silent gap before anything new plays).
  nextPlaybackTime = audioCtx ? audioCtx.currentTime : 0;
}

function handleAudioMessage(ev) {
  if (typeof ev.data === "string") {
    let msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    if (msg && msg.type === "cancel") cancelPlayback();
    return;
  }
  playback(ev.data);
}

async function attachScriptProcessorFallback() {
  captureNode = audioCtx.createScriptProcessor(4096, 1, 1);
  let buf = new Float32Array(0);
  captureNode.onaudioprocess = (e) => {
    const input = e.inputBuffer.getChannelData(0);
    const merged = new Float32Array(buf.length + input.length);
    merged.set(buf, 0);
    merged.set(input, buf.length);
    buf = merged;
    while (buf.length >= 2560) {
      const chunk = buf.slice(0, 2560);
      buf = buf.slice(2560);
      if (audioWs && audioWs.readyState === WebSocket.OPEN) audioWs.send(chunk.buffer);
    }
  };
  sourceNode.connect(captureNode);
  captureNode.connect(silentGain);
}

async function attachWorkletCapture() {
  const blob = new Blob([WORKLET_SOURCE], { type: "application/javascript" });
  const url = URL.createObjectURL(blob);
  await audioCtx.audioWorklet.addModule(url);
  captureNode = new AudioWorkletNode(audioCtx, "pcm-chunker");
  captureNode.port.onmessage = (ev) => {
    if (audioWs && audioWs.readyState === WebSocket.OPEN) audioWs.send(ev.data.buffer);
  };
  sourceNode.connect(captureNode);
  captureNode.connect(silentGain);
}

async function start() {
  if (running) return;
  document.getElementById("mic-error").textContent = "";
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1, sampleRate: 16000 },
    });
  } catch (err) {
    document.getElementById("mic-error").textContent = "mic permission denied: " + err.message;
    return;
  }

  audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
  await audioCtx.resume();
  sourceNode = audioCtx.createMediaStreamSource(micStream);
  silentGain = audioCtx.createGain();
  silentGain.gain.value = 0; // keep the capture node pulled by the graph without audible passthrough
  silentGain.connect(audioCtx.destination);

  nextPlaybackTime = 0;
  audioWs = new WebSocket(wsUrl("/audio"));
  audioWs.binaryType = "arraybuffer";
  audioWs.onopen = () => setChip("chip-audio", "audio live", "");
  audioWs.onmessage = handleAudioMessage;
  audioWs.onclose = () => { if (running) setChip("chip-audio", "audio disconnected", "bad"); };

  if (audioCtx.audioWorklet) {
    try {
      await attachWorkletCapture();
    } catch (err) {
      console.warn("AudioWorklet failed, falling back to ScriptProcessor", err);
      await attachScriptProcessorFallback();
    }
  } else {
    await attachScriptProcessorFallback();
  }

  running = true;
  setChip("chip-mic", "mic live", "");
  updateButton();
}

function stop() {
  running = false;
  try { audioWs && audioWs.close(); } catch (e) {}
  try { captureNode && captureNode.disconnect(); } catch (e) {}
  try { sourceNode && sourceNode.disconnect(); } catch (e) {}
  try { silentGain && silentGain.disconnect(); } catch (e) {}
  try { micStream && micStream.getTracks().forEach((t) => t.stop()); } catch (e) {}
  try { audioCtx && audioCtx.close(); } catch (e) {}
  audioWs = null; audioCtx = null; sourceNode = null; captureNode = null; silentGain = null; micStream = null;
  activeSources = [];
  nextPlaybackTime = 0;
  setChip("chip-mic", "mic off", "");
  setChip("chip-audio", "audio off", "");
  updateButton();
}

function updateButton() {
  const btn = document.getElementById("btn-start-stop");
  btn.textContent = running ? "Stop listening" : "Start listening";
  btn.classList.toggle("running", running);
}

function toggle() {
  if (running) stop(); else start();
}

// --- wire it up ------------------------------------------------------------------

document.getElementById("btn-start-stop").addEventListener("click", toggle);
document.getElementById("inject-form").addEventListener("submit", onInjectSubmit);
document.getElementById("btn-reset").addEventListener("click", resetDemo);
connectEvents();
pollState();
setInterval(pollState, 500);
</script>
