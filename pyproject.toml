[project]
name = "moshi-tools"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.140.1",
    "httpx>=0.28.1",
    "numpy>=2.2.6",
    "pydantic>=2.13.4",
    "scipy>=1.15.3",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
    "uvicorn>=0.51.0",
    "websockets>=16.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
